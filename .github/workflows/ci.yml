name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    name: Tests Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Tests unitaires Core
        run: dotnet test tests/SecureDesk.Core.Tests -c Release --logger "trx;LogFileName=core-linux.trx"

  build-windows:
    name: Build, analyse et tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restauration
        run: dotnet restore SecureDesk.slnx
      - name: Format (style)
        run: dotnet format SecureDesk.slnx --verify-no-changes --no-restore --severity warn
      - name: Build (avertissements = erreurs, analyseurs .NET)
        run: dotnet build SecureDesk.slnx -c Release --no-restore
      - name: Tests unitaires
        run: dotnet test tests/SecureDesk.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-windows.trx"
